[server]
# The app is CPU-only and downloads a ~255 MB model on first run, so give the
# container room to start up before the browser gives up.
headless = true
enableXsrfProtection = true

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#e74c3c"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f5f7fa"
textColor = "#1a1a1a"
font = "sans serif"